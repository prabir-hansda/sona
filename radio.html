<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sona FM — Live Radio</title><style>:root{--a:#ff7846;--b:#ffbd70;--text:#fff;--muted:#aaa;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px system-ui;background:linear-gradient(#08080b99,#08080bcc),url('https://i.postimg.cc/Kvm7DrC1/file-00000000a7a481fd888dfc8adaf29dc1.png') center/cover fixed no-repeat}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:22px 0 150px}nav{display:flex;justify-content:space-between;align-items:center}a{color:#fff;text-decoration:none}.brand{font-size:20px;font-weight:900}.brand b{color:var(--b)}.back{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#ffffff0c}.hero{margin:42px 0 22px}.eyebrow{color:var(--b);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(3rem,8vw,6rem);line-height:.9;letter-spacing:-.07em;margin:12px 0}.lead{color:var(--muted);max-width:650px;line-height:1.6}.toolbar{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:11px;border:1px solid var(--line);border-radius:17px;background:#08080baa}.toolbar>*{height:48px;border:1px solid var(--line);border-radius:11px;background:#ffffff0b;color:#fff;padding:0 13px}.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.station{min-height:125px;text-align:left;padding:17px;border:1px solid var(--line);border-radius:18px;background:#08080baa;color:#fff;cursor:pointer}.station:hover{border-color:#ffbd7066;transform:translateY(-2px)}small{color:var(--muted)}.empty{grid-column:1/-1;padding:45px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.player{position:fixed;z-index:10;left:50%;bottom:10px;transform:translateX(-50%);width:min(900px,calc(100% - 16px));padding:11px 14px;display:flex;align-items:center;gap:14px;border:1px solid #ffffff22;border-radius:20px;background:#111117e8;backdrop-filter:blur(20px)}.now{flex:1;min-width:0}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:6px}.controls button{width:38px;height:38px;border:0;border-radius:50%;background:#ffffff0d;color:#fff;cursor:pointer}.controls #play{background:linear-gradient(135deg,var(--a),var(--b));color:#21130d}.vol{width:100px}.vol input{width:100%}@media(max-width:700px){.stations{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}@media(max-width:500px){.stations{grid-template-columns:1fr}.vol{display:none}}</style></head><body><main class="wrap"><nav><a class="brand" href="index.html">SONA <b>FM</b></a><a class="back" href="index.html">← Home</a></nav><section class="hero"><div class="eyebrow">Live Indian Radio</div><h1>FM Radio.</h1><p class="lead">India ke live radio stations ko search, filter aur listen karo. Ye section YouTube Music se completely separate hai.</p></section><div class="toolbar"><select id="genre"><option value="">All genres</option><option value="bollywood">Bollywood</option><option value="hindi">Hindi</option><option value="punjabi">Punjabi</option><option value="tamil">Tamil</option><option value="telugu">Telugu</option><option value="news">News</option><option value="devotional">Devotional</option></select><input id="search" placeholder="Search station or city…"></div><div class="stations" id="stations"><div class="empty">Loading Indian stations…</div></div></main><div class="player"><div class="now"><strong id="now">Choose a station</strong><small id="status">FM Radio ready</small></div><div class="controls"><button id="prev">⏮</button><button id="play">▶</button><button id="next">⏭</button></div><div class="vol"><input id="vol" type="range" min="0" max="1" step=".01" value=".9"></div></div><audio id="audio"></audio><script>const $=id=>document.getElementById(id),audio=$("audio"),box=$("stations"),genre=$("genre"),search=$("search"),now=$("now"),status=$("status"),play=$("play"),prev=$("prev"),next=$("next"),vol=$("vol");let data=[],idx=-1;function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=search.value.toLowerCase(),g=genre.value,list=data.filter(s=>(!g||(s.tags||'').toLowerCase().includes(g))&&(!q||s.name.toLowerCase().includes(q)||(s.city||'').toLowerCase().includes(q)));box.innerHTML=list.length?'':'<div class="empty">No station found.</div>';list.forEach((s,i)=>{let b=document.createElement('button');b.className='station';b.innerHTML='<b>'+esc(s.name)+'</b><br><small>'+esc(s.city||s.state||'India')+' • '+esc(s.codec||'LIVE')+'</small>';b.onclick=()=>start(s,i);box.appendChild(b)})}async function load(){for(const base of ['https://de1.api.radio-browser.info/json','https://at1.api.radio-browser.info/json'])try{let r=await fetch(base+'/stations/search?limit=100&countrycode=IN&hidebroken=true&order=clickcount&reverse=true');if(r.ok){data=await r.json();render();return}}catch(e){}box.innerHTML='<div class="empty">Radio stations unavailable. Refresh and try again.</div>'}function start(s,i){idx=i;audio.src=s.url_resolved;now.textContent=s.name;status.textContent=(s.city||s.state||'India')+' • Live FM';audio.play().catch(()=>status.textContent='Stream unavailable — choose another station')}play.onclick=()=>{if(audio.src)audio.paused?audio.play():audio.pause()};prev.onclick=()=>{if(data.length)start(data[(idx-1+data.length)%data.length],(idx-1+data.length)%data.length)};next.onclick=()=>{if(data.length)start(data[(idx+1)%data.length],(idx+1)%data.length)};audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.onerror=()=>status.textContent='Stream unavailable';vol.oninput=()=>audio.volume=vol.value;audio.volume=.9;genre.onchange=load;search.oninput=render;load();</script></body></html>
