<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Sona FM — Live Indian Radio</title><style>:root{--a:#ff7846;--b:#ffbd70;--text:#fff;--muted:#aaa;--line:#ffffff22;--g:#4bd79b}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#08080b99,#08080bd9),url('https://i.postimg.cc/Kvm7DrC1/file-00000000a7a481fd888dfc8adaf29dc1.png') center/cover fixed no-repeat}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 145px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;letter-spacing:-.04em}.brand b{color:var(--b)}.live{color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:7px}.hero{margin:60px 0 28px;padding:30px;border:1px solid var(--line);border-radius:26px;background:#08080b70;backdrop-filter:blur(12px)}.eyebrow{color:var(--b);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(3.4rem,9vw,7rem);line-height:.87;letter-spacing:-.08em;margin:14px 0}.lead{color:var(--muted);max-width:700px;font-size:17px;line-height:1.65}.toolbar{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:11px;border:1px solid var(--line);border-radius:18px;background:#08080baa}.toolbar>*{height:48px;border:1px solid var(--line);border-radius:11px;background:#ffffff0b;color:#fff;padding:0 13px;outline:none}.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.station{min-height:130px;text-align:left;padding:17px;border:1px solid var(--line);border-radius:18px;background:#08080baa;color:#fff;cursor:pointer;transition:.18s}.station:hover{transform:translateY(-3px);border-color:#ffbd7066}.station.active{border-color:var(--b);box-shadow:0 0 0 1px #ffbd7033}.station small{color:var(--muted)}.empty{grid-column:1/-1;padding:45px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.player{position:fixed;z-index:10;left:50%;bottom:10px;transform:translateX(-50%);width:min(900px,calc(100% - 16px));padding:12px 15px;display:flex;align-items:center;gap:15px;border:1px solid #ffffff22;border-radius:20px;background:#111117e8;backdrop-filter:blur(20px);box-shadow:0 18px 60px #0008}.now{flex:1;min-width:0}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:var(--muted);font-size:11px}.controls{display:flex;gap:6px}.controls button{width:40px;height:40px;border:0;border-radius:50%;background:#ffffff0d;color:#fff;cursor:pointer}.controls #play{background:linear-gradient(135deg,var(--a),var(--b));color:#21130d}.vol{width:100px}.vol input{width:100%}footer{margin-top:25px;color:#777;font-size:12px}@media(max-width:800px){.stations{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{padding:22px;margin-top:40px}.toolbar{grid-template-columns:1fr}.stations{grid-template-columns:1fr}.vol{display:none}.player{gap:8px}.controls button{width:37px;height:37px}}</style></head><body><main class="wrap"><header class="nav"><div class="brand">SONA <b>FM</b></div><div class="live"><span class="dot"></span>Live Indian Radio</div></header><section class="hero"><div class="eyebrow">24/7 • Indian radio</div><h1>Just Radio.</h1><p class="lead">Sona FM — ek simple, professional single-page radio player. Indian live stations search karo aur bina kisi extra service ke seedha radio suno.</p></section><section><div class="toolbar"><select id="genre"><option value="">All genres</option><option value="bollywood">Bollywood</option><option value="hindi">Hindi</option><option value="punjabi">Punjabi</option><option value="tamil">Tamil</option><option value="telugu">Telugu</option><option value="malayalam">Malayalam</option><option value="news">News</option><option value="devotional">Devotional</option></select><input id="search" placeholder="Search station, city or name…"></div><div class="stations" id="stations"><div class="empty">Loading Indian radio stations…</div></div></section><footer>Sona FM • Live Indian Radio</footer></main><div class="player"><div class="now"><strong id="now">Choose a station</strong><small id="status">Radio ready</small></div><div class="controls"><button id="prev" aria-label="Previous station">⏮</button><button id="play" aria-label="Play or pause">▶</button><button id="next" aria-label="Next station">⏭</button></div><div class="vol"><input id="vol" type="range" min="0" max="1" step=".01" value=".9" aria-label="Volume"></div></div><audio id="audio"></audio><script>const $=id=>document.getElementById(id),audio=$("audio"),box=$("stations"),genre=$("genre"),search=$("search"),now=$("now"),status=$("status"),play=$("play"),prev=$("prev"),next=$("next"),vol=$("vol");let data=[],idx=-1;function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=search.value.toLowerCase().trim(),g=genre.value,list=data.filter(s=>(!g||(s.tags||'').toLowerCase().includes(g))&&(!q||s.name.toLowerCase().includes(q)||(s.city||'').toLowerCase().includes(q)||(s.state||'').toLowerCase().includes(q)));box.innerHTML=list.length?'':'<div class="empty">No station found.</div>';list.forEach(s=>{let b=document.createElement('button');b.className='station'+(data.indexOf(s)===idx?' active':'');b.innerHTML='<b>'+esc(s.name)+'</b><br><small>'+esc(s.city||s.state||'India')+' • '+esc(s.codec||'LIVE')+'</small>';b.onclick=()=>start(s,data.indexOf(s));box.appendChild(b)})}async function load(){for(const base of ['https://de1.api.radio-browser.info/json','https://at1.api.radio-browser.info/json'])try{let r=await fetch(base+'/stations/search?limit=100&countrycode=IN&hidebroken=true&order=clickcount&reverse=true');if(r.ok){data=await r.json();render();return}}catch(e){}box.innerHTML='<div class="empty">Radio stations unavailable. Please refresh.</div>'}function start(s,i){idx=i;audio.src=s.url_resolved;now.textContent=s.name;status.textContent=(s.city||s.state||'India')+' • Live';render();audio.play().catch(()=>status.textContent='Stream unavailable — choose another station')}play.onclick=()=>{if(!audio.src)return;audio.paused?audio.play():audio.pause()};prev.onclick=()=>{if(data.length)start(data[(idx-1+data.length)%data.length],(idx-1+data.length)%data.length)};next.onclick=()=>{if(data.length)start(data[(idx+1)%data.length],(idx+1)%data.length)};audio.onplay=()=>play.textContent='❚❚';audio.onpause=()=>play.textContent='▶';audio.onerror=()=>status.textContent='Stream unavailable';vol.oninput=()=>audio.volume=vol.value;audio.volume=.9;genre.onchange=render;search.oninput=render;load();</script></body></html>
